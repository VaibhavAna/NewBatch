<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Certificate Generator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:30px;
    }

    h1{
      margin-bottom:20px;
      color:#333;
    }

    .form-box{
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      width:350px;
      margin-bottom:30px;
    }

    .form-box input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:16px;
    }

    .form-box button{
      width:100%;
      padding:12px;
      border:none;
      background:#007bff;
      color:white;
      font-size:16px;
      border-radius:6px;
      cursor:pointer;
    }

    .form-box button:hover{
      background:#0056b3;
    }

    .certificate{
      width:800px;
      height:550px;
      background:white;
      border:12px solid #d4af37;
      padding:40px;
      text-align:center;
      position:relative;
      display:none;
    }

    .certificate h2{
      font-size:42px;
      color:#d4af37;
      margin-bottom:20px;
    }

    .certificate h3{
      font-size:28px;
      margin-top:30px;
      color:#333;
    }

    .certificate p{
      font-size:20px;
      margin-top:20px;
      color:#555;
      line-height:1.6;
    }

    .name{
      font-size:36px;
      color:#000;
      font-weight:bold;
      margin:25px 0;
    }

    .footer{
      position:absolute;
      bottom:40px;
      left:50px;
      right:50px;
      display:flex;
      justify-content:space-between;
    }

    .signature{
      text-align:center;
    }

    .line{
      width:180px;
      border-top:2px solid #000;
      margin-bottom:5px;
    }

    #downloadBtn{
      margin-top:20px;
      padding:12px 20px;
      border:none;
      background:green;
      color:white;
      border-radius:6px;
      cursor:pointer;
      display:none;
    }

    #downloadBtn:hover{
      background:darkgreen;
    }
  </style>
</head>

<body>

  <h1>Certificate Generator</h1>

  <div class="form-box">
    <input type="text" id="nameInput" placeholder="Enter Name">
    <input type="text" id="courseInput" placeholder="Enter Course Name">
    <button onclick="generateCertificate()">Generate Certificate</button>
  </div>

  <div class="certificate" id="certificate">

    <h2>Certificate of Completion</h2>

    <p>This certificate is proudly presented to</p>

    <div class="name" id="studentName">Your Name</div>

    <p>
      for successfully completing the course
    </p>

    <h3 id="courseName">Web Development</h3>

    <p>
      Awarded on <span id="date"></span>
    </p>

    <div class="footer">
      <div class="signature">
        <div class="line"></div>
        <span>Instructor</span>
      </div>

      <div class="signature">
        <div class="line"></div>
        <span>Director</span>
      </div>
    </div>

  </div>

  <button id="downloadBtn" onclick="window.print()">
    Download / Print Certificate
  </button>

  <script>
    function generateCertificate() {

      let name = document.getElementById("nameInput").value;
      let course = document.getElementById("courseInput").value;

      if(name === "" || course === ""){
        alert("Please fill all fields");
        return;
      }

      document.getElementById("studentName").innerText = name;
      document.getElementById("courseName").innerText = course;

      let today = new Date();
      document.getElementById("date").innerText =
        today.toLocaleDateString();

      document.getElementById("certificate").style.display = "block";
      document.getElementById("downloadBtn").style.display = "inline-block";
    }
  </script>

</body>
</html>
